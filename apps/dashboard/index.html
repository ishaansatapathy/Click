<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Click gives coding agents the right code, not the whole repo: a code graph in HydraDB, measured against a plain store." />
    <title>Click: a context layer for coding agents</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a6df4'/%3E%3Cpath d='M9 22 16 8l7 14h-4l-3-6-3 6z' fill='white'/%3E%3C/svg%3E" />
    <script>
      // apply the saved theme before first paint, so there is no flash
      try { var t = localStorage.getItem('click-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"><p style="padding:2rem;font-family:system-ui">Loading Click…</p></div>
    <noscript>This page needs JavaScript to draw its charts and the interactive demo.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
