name: click-hydradb

x-hydradb-environment: &hydradb-environment
  CLOUD_PROVIDER: local
  LOCAL_PATH: /data/store
  GRAPH_NAMESPACE: default
  GRAPH_ID: default
  GRAPH_CELL_ID: cell-0
  GRAPH_CELLS: cell-0
  GRAPH_AUTH_TOKEN_FILE: /data/auth-token
  GRAPH_ALLOW_PLAINTEXT: "true"
  RUST_MIN_STACK: "33554432"
  GRAPH_USAGE_REPORT_ENABLED: "false"

services:
  init:
    image: ghcr.io/hydra-db/hydradb:0.4.0
    container_name: click-hydradb-init
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mkdir -p /data/store /data/cache /data/cache-indexer;
        printf '%s\n' "$${HYDRADB_TOKEN}" > /data/auth-token;
        chmod 600 /data/auth-token;
        chown -R 10001:10001 /data
    environment:
      HYDRADB_TOKEN: ${HYDRADB_TOKEN:?HYDRADB_TOKEN is set by pnpm hydra:up}
    volumes:
      - data:/data
    restart: "no"

  graph-node:
    image: ghcr.io/hydra-db/hydradb:0.4.0
    container_name: click-hydradb-node
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      <<: *hydradb-environment
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=graph-node:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_BOLT_ADDR: 0.0.0.0:7687
      GRAPH_HTTP_ADDR: 0.0.0.0:8443
      GRAPH_ADMIN_ADDR: 0.0.0.0:9090
      GRAPH_DATA_CACHE_DIR: /data/cache
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9090:9090"
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9090;
          printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r line <&3;
          [[ "$$line" == *" 200 "* ]]'
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    restart: unless-stopped

  graph-indexer:
    image: ghcr.io/hydra-db/hydradb:0.4.0
    container_name: click-hydradb-indexer
    entrypoint: ["/usr/local/bin/graph-indexer"]
    depends_on:
      init:
        condition: service_completed_successfully
      graph-node:
        condition: service_healthy
    environment:
      <<: *hydradb-environment
      GRAPH_NODE_ID: indexer-0
      GRAPH_DATA_CACHE_DIR: /data/cache-indexer
      GRAPH_INDEXER_ADMIN_ADDR: 0.0.0.0:9095
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
    name: click-hydradb
