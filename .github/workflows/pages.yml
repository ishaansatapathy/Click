# Builds the static dashboard (apps/dashboard) and publishes it to GitHub Pages. The site has no backend: the data it shows
# is committed under apps/dashboard/public/data and comes from bench/results.jsonl, so the build needs nothing but Node.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'packages/core/src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the dashboard
        run: pnpm exec vitest run apps/dashboard
      - name: Build
        run: pnpm --filter @click/dashboard build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
